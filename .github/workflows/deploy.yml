name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          # 只发布纯前端运行时所需文件；排除依赖符号链接与开发资产
          exclude: |
            node_modules
            tests
            docs
            .github
            .gitignore
            PRD.md
            DEV_PLAN.md
            README.md

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
